name: Publish verified client bundles
on:
  push:
    branches: [main]
    paths: [release-transfer.json]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 tools/publish-clients.py
        env:
          GH_TOKEN: ${{ github.token }}
